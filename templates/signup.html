<!doctype html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <meta
 name="viewport"
 content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
 />
 <title>Sign Up - bobworld</title>
 <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000080'/%3E%3Ctext x='16' y='23' font-family='Tahoma,Arial' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
        />
 <link rel="stylesheet" href="/static/css/chat.css?v=11" />
 </head>
 <body>
 <div class="auth-container">
 <div class="auth-card">
 <h1>Create Account</h1>
 {% if error %}
 <div class="msg-error" role="alert">{{ error }}</div>
 {% endif %}
 <form method="POST" action="/signup">
 <div class="form-group">
 <label for="su-username">Username</label>
 <input
 type="text"
 id="su-username"
 name="username"
 required
 maxlength="32"
 autocomplete="username"
 autocapitalize="none"
 pattern="[A-Za-z0-9_.-]+"
 title="Letters, numbers, dots, dashes and underscores only"
 value="{{ username }}"
 />
 </div>
 <div class="form-group">
 <label for="su-password">Password</label>
 <input
 type="password"
 id="su-password"
 name="password"
 required
 autocomplete="new-password"
 />
 </div>
 <div class="form-group">
 <label for="su-display">Display Name (required)</label>
 <input
 type="text"
 id="su-display"
 name="display_name"
 required
 maxlength="64"
 value="{{ display_name }}"
 />
 </div>
 <div class="form-group">
 <label for="su-bio">Bio</label>
 <textarea
 id="su-bio"
 name="bio"
 rows="2"
 maxlength="500">{{ bio }}</textarea>
 </div>
 <button type="submit" class="save-btn">Sign Up</button>
 <a href="/login" class="back-btn"
 >Already have an account?</a
 >
 </form>
 </div>
 </div>
 <script>
 const savedTheme = localStorage.getItem("bobworld-theme") || "light";
 document.documentElement.setAttribute("data-theme", savedTheme);
 </script>
 </body>
</html>
