<nav class="app-switcher" aria-label="Section switcher">
    <a
        href="/chat"
        class="switch-btn{% if section == 'chat' %} active{% endif %}"
        >Chat</a
    >

    <a
        href="/forum"
        class="switch-btn{% if section == 'forum' %} active{% endif %}"
        >Forum</a
    >
    <a
        href="/games"
        class="switch-btn{% if section == 'games' %} active{% endif %}"
        >Games</a
    >
    <div class="notif-wrap">
        <button
            type="button"
            id="notifBell"
            class="notif-bell"
            title="Notifications"
            aria-label="Notifications"
        >
            <svg
                class="icon-bell"
                width="15"
                height="15"
                viewBox="0 0 16 16"
                fill="currentColor"
                aria-hidden="true"
            >
                <path
                    d="M8 1.5c-.6 0-1 .4-1 1v.6C5.3 3.5 4.3 4.9 4.3 6.7v2.6l-1 1.6v.6h9.4v-.6l-1-1.6V6.7c0-1.8-1-3.2-2.7-3.6v-.6c0-.6-.4-1-1-1zM6.5 12.5a1.5 1.5 0 0 0 3 0z"
                />
            </svg><span
                id="notifBadge"
                class="notif-badge"
                hidden
            ></span>
        </button>
        <div id="notifPanel" class="notif-panel" hidden>
            <div class="notif-head">
                Notifications
                <button
                    type="button"
                    id="notifClear"
                    class="post-del"
                >
                    mark all read
                </button>
            </div>
            <div id="notifList" class="notif-list"></div>
        </div>
    </div>
</nav>
