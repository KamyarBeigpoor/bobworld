<!doctype html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <meta
 name="viewport"
 content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
 />
 <title>Login - bobworld</title>
 <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000080'/%3E%3Ctext x='16' y='23' font-family='Tahoma,Arial' font-size='18' font-weight='bold' fill='%23fff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E"
        />
 <link rel="stylesheet" href="/static/css/chat.css?v=11" />
 </head>
 <body>
 <div class="auth-container">
 <div class="auth-card">
 <h1>Login</h1>
 {% if error %}
 <div class="msg-error" role="alert">{{ error }}</div>
 {% endif %}
 {% if deleted %}
 <div class="msg-ok" role="status">
 Your account has been deleted.
 </div>
 {% endif %}
 <form method="POST" action="/login">
 <div class="form-group">
 <label for="login-username">Username</label>
 <input
 type="text"
 id="login-username"
 name="username"
 required
 autofocus
 autocomplete="username"
 autocapitalize="none"
 value="{{ username }}"
 />
 </div>
 <div class="form-group">
 <label for="login-password">Password</label>
 <input
 type="password"
 id="login-password"
 name="password"
 required
 autocomplete="current-password"
 />
 </div>
 <button type="submit" class="save-btn">Login</button>
 <a href="/signup" class="back-btn">Create account</a>
 </form>
 </div>
 </div>
 <script>
 const savedTheme = localStorage.getItem("bobworld-theme") || "light";
 document.documentElement.setAttribute("data-theme", savedTheme);
 </script>
 </body>
</html>
